name: ci
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  # The organisation's shared neutrality check.
  neutrality:
    permissions:
      contents: read
    uses: zaentrum/.github/.github/workflows/neutrality.yml@v1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
