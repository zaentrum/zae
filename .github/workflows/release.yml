name: release
# The run says which tag it releases, so a run started by hand for a tag can be
# told from any other.
run-name: release ${{ inputs.tag || github.ref_name }}
on:
  push:
    tags: ["v*"]
  # A tag carries the workflow it was pushed with, so a fault in these steps
  # cannot be mended on the tag. Started by hand on main, the workflow builds
  # the named tag's source with main's steps.
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build, such as v1.2.3"
        required: true
        type: string
permissions:
  contents: write
  # id-token and attestations: the workflow's own identity signs the record
  # of the build of every file the release publishes: there is no key to keep.
  id-token: write
  attestations: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tag this run was started for is the tag released. A release is
          # tagged on the commit its pre-release was tried on, so that commit
          # carries both tags, and left to choose GoReleaser takes the
          # pre-release's.
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
      # The list of the packages the binaries hold, read from the binaries.
      - uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: zae.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # The build's record of every file the release publishes (which
      # repository, which commit, which workflow), signed by this workflow.
      # A run started by hand records main's workflow and commit, the run's
      # own; the files it records are built from the tag's source.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      # The list, attached to each archive the same way.
      - uses: actions/attest-sbom@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
          sbom-path: zae.spdx.json
