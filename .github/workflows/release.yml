name: release
# The run says which tag it releases, so a run started by hand for a tag can be
# told from any other.
run-name: release ${{ inputs.tag || github.ref_name }}
on:
  push:
    tags: ["v*"]
  # A tag carries the workflow it was pushed with, so a fault in these steps
  # cannot be mended on the tag. Started by hand on main, the workflow builds
  # the named tag's source with main's steps.
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build, such as v1.2.3"
        required: true
        type: string
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tag this run was started for is the tag released. A release is
          # tagged on the commit its pre-release was tried on, so that commit
          # carries both tags, and left to choose GoReleaser takes the
          # pre-release's.
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
